    "numpy (>=2.5.4,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "nltk (>=3.10.4,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "joblib (>=1.6.0,<2.0.0)",
    "torch (>=2.14.1,<3.0.0)",
    "transformers[torch] (>=5.21.0,<6.0.0)",
    "sentence-transformers (>=6.2.0,<7.0.0)",
