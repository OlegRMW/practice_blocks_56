# Paths are relative to this YAML file.
seed: 42
data_dir: ../data
models_dir: ../models/classic
reports_dir: ../data/reports
validation_size: 0.2

versions:
  v1_basic: {}
  v2_no_stopwords:
    remove_stopwords: true
  v3_lemma:
    normalization: lemma
  v4_lemma_no_stopwords:
    normalization: lemma
    remove_stopwords: true
  v5_stem:
    normalization: stem
  v6_original_case:
    lowercase: false

tfidf:
  analyzer: word
  lowercase: false
  ngram_range: [1, 1]
  min_df: 2
  max_df: 0.95
  max_features: 10000
  norm: l2
  sublinear_tf: true

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  gradient_boosting:
    svd_components: 100
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
